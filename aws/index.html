<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой СРО Веб-сайт</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 50px 60px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 450px; }
        h1 { font-size: 36px; margin: 0 0 20px; }
        p { color: #555; font-size: 18px; line-height: 1.3; }
        .badge { display: inline-block; background-color: #2ec4b6; color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 18px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Сайт успешно развернут! 🚀</h1>
        <p>Выполнение Задания (СРО) по деплою сайта в облачную инфраструктуру AWS S3.</p>
        <div class="badge">Статус: Доступен в сети</div>
    </div>
</body>
</html>
